plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yoanndp.share2save'
    compileSdk 34

    defaultConfig {
        applicationId "com.yoanndp.share2save"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Bibliothèque de base pour les composants d'interface (AppCompat)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // Pour les composants Material Design (souvent requis par les thèmes)
    implementation 'com.google.android.material:material:1.11.0'
    
    // Core KTX pour des fonctions Kotlin plus "propres" sur Android
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // Si tu utilises des Layouts spécifiques (comme ConstraintLayout) :
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

}